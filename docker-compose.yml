version: '3.8'  # Compatible with recent Docker Compose

services:
  db:
    image: postgres:16  # Use latest stable version (or 'postgres:latest')
    restart: always  # Auto-restart if it crashes
    environment:
      POSTGRES_USER: postgres  # Matches your .env
      POSTGRES_PASSWORD: password  # Matches your .env
      POSTGRES_DB: movie_db  # Auto-creates this DB on first run
    ports:
      - "5432:5432"  # Exposes Postgres on localhost:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persists data

volumes:
  postgres_data:  # Named volume for data persistence
